<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="description" content="Dragon Studio | ساخت بازی، ادیت ویدیو و خدمات دیجیتال" />
  <title>Dragon Studio | Create. Play. Edit.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08080c;
      --bg-soft: #12080a;
      --panel: rgba(43, 8, 12, .62);
      --panel-strong: rgba(70, 9, 14, .82);
      --line: rgba(239, 68, 68, .28);
      --red: #b91c1c;
      --red-bright: #ff2d2d;
      --orange: #ff8a3d;
      --white: #fff8f8;
      --muted: #b8a7aa;
      --max: 1180px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--white);
      background: radial-gradient(circle at 50% -15%, #3c0b10 0, var(--bg) 43%, #050507 100%);
      font-family: "Vazirmatn", Tahoma, sans-serif;
      line-height: 1.85;
      overflow-x: hidden;
    }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .14; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(to bottom, black, transparent 72%); }
    canvas#embers { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
    a { color: inherit; text-decoration: none; }
    .container { width: min(var(--max), calc(100% - 36px)); margin: auto; }
    .nav-wrap { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid rgba(255,45,45,.18); background: rgba(8,8,12,.78); backdrop-filter: blur(18px); }
    nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 1.18rem; font-weight: 900; letter-spacing: .2px; white-space: nowrap; }
    .brand span { filter: drop-shadow(0 0 10px var(--red-bright)); font-size: 1.5rem; }
    .brand-logo { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(255,90,75,.65); }
    .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; padding: 0; margin: 0; }
    .nav-links a { color: #d8c9cb; font-size: .86rem; padding: 7px 10px; border-radius: 6px; transition: .25s ease; }
    .nav-links a:hover { color: white; background: rgba(185,28,28,.22); }
    .menu-toggle { display: none; border: 1px solid var(--line); background: #1d0b0e; color: white; border-radius: 6px; padding: 8px 11px; font-size: 1.2rem; cursor: pointer; }
    section { padding: 96px 0; scroll-margin-top: 72px; }
    .hero { min-height: calc(100vh - 72px); display: grid; align-items: center; padding-top: 70px; position: relative; }
    .hero-content { max-width: 800px; }
    .eyebrow { color: #ff6a55; font-size: .84rem; font-weight: 700; letter-spacing: 1px; }
    h1 { margin: 8px 0 10px; line-height: 1.1; font-size: clamp(2.9rem, 8vw, 6.8rem); font-weight: 900; letter-spacing: 0; background: linear-gradient(110deg, #fff 15%, #ff9280 43%, #ff2d2d 85%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 35px rgba(255,45,45,.18); }
    h2 { margin: 0 0 16px; font-size: clamp(1.65rem, 3vw, 2.5rem); line-height: 1.3; }
    h3 { margin: 0 0 7px; font-size: 1.04rem; }
    .subtitle { color: #ffb4a7; font-size: 1rem; direction: ltr; text-align: right; }
    .lead { max-width: 690px; color: var(--muted); font-size: 1.08rem; margin: 20px 0 30px; }
    .quick-actions { display: flex; flex-wrap: wrap; gap: 11px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 45px; padding: 8px 17px; border: 1px solid rgba(255,90,75,.65); border-radius: 6px; color: white; background: linear-gradient(135deg, #b91c1c, #6f0c12); box-shadow: 0 8px 24px rgba(124, 0, 0, .22); font: inherit; font-size: .88rem; cursor: pointer; transition: transform .25s, box-shadow .25s, background .25s; }
    .btn:hover { transform: translateY(-3px); background: linear-gradient(135deg, #e32929, #8b0000); box-shadow: 0 12px 30px rgba(239,68,68,.3); }
    .btn.secondary { background: rgba(255,255,255,.045); border-color: rgba(255,255,255,.16); }
    .section-head { margin-bottom: 26px; max-width: 790px; }
    .section-head p, .about-copy, .contact-intro { color: var(--muted); margin: 0; }
    .section-kicker { color: #ff5d4c; font-weight: 800; font-size: .82rem; margin-bottom: 5px; }
    .glass { background: linear-gradient(135deg, rgba(92,10,16,.48), rgba(18,8,10,.62)); border: 1px solid var(--line); box-shadow: 0 14px 45px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.04), 0 0 28px rgba(128,0,0,.07); backdrop-filter: blur(13px); }
    .about-box { padding: 28px; border-radius: 8px; max-width: 900px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card { border-radius: 7px; padding: 20px; min-height: 130px; transition: transform .25s, border-color .25s, background .25s; }
    .card:hover { transform: translateY(-5px); border-color: rgba(255,75,75,.7); background: linear-gradient(135deg, rgba(117,12,19,.6), rgba(25,8,10,.75)); }
    .card p { margin: 0; color: var(--muted); font-size: .9rem; }
    .game-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0; margin: 25px 0 0; list-style: none; }
    .game-list li { padding: 15px 18px; border-radius: 7px; color: #eadcdf; font-size: .92rem; }
    .game-card { display: grid; gap: 12px; padding: 14px; border-radius: 7px; max-width: 560px; }
    .game-banner { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; border: 1px solid rgba(255,90,75,.28); background: #120709; }
    .coming-soon { margin: 0; color: #ffb1a4; font-weight: 700; font-size: .95rem; }
    .price { margin-top: 27px; display: flex; align-items: center; flex-wrap: wrap; gap: 15px; padding: 18px 20px; border-right: 3px solid var(--red-bright); border-radius: 5px; background: rgba(113,8,14,.2); }
    .price strong { color: #ffbaa9; }
    .collab { display: grid; grid-template-columns: .8fr 1.2fr; gap: 18px; align-items: stretch; }
    .collab-box { padding: 25px; border-radius: 8px; }
    .collab-list { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; padding: 0; margin: 16px 0 0; }
    .collab-list li { padding: 8px 13px; color: #f1dfe1; border: 1px solid rgba(255,255,255,.1); border-radius: 5px; background: rgba(255,255,255,.04); }
    .support-zone { position: relative; }
    .support-zone::before { content: ""; position: absolute; width: 360px; height: 180px; top: 20px; left: -100px; background: rgba(175,0,0,.22); filter: blur(80px); pointer-events: none; }
    .support-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; position: relative; }
    .support-card { display: flex; flex-direction: column; gap: 5px; padding: 21px; min-height: 145px; border-radius: 8px; transition: .25s; }
    .support-card:hover { transform: translateY(-5px); border-color: rgba(255,90,75,.75); }
    .support-card small { color: #a99699; }
    .support-card .url { color: #ff9c8c; direction: ltr; text-align: right; font-size: .8rem; word-break: break-all; }
    .support-card.bale { border-color: rgba(255,67,88,.85); background: linear-gradient(135deg, rgba(157,13,29,.78), rgba(51,7,15,.75)); box-shadow: 0 0 32px rgba(232,38,67,.2); }
    .support-note { color: #9f8d90; font-size: .78rem; margin-top: 15px; }
    .social-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .social-card { padding: 20px; border-radius: 7px; }
    .social-card p { color: var(--muted); margin: 2px 0 0; font-size: .87rem; }
    .download-box { padding: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .warning { color: #ffb06b; margin: 8px 0 0; font-size: .87rem; }
    footer { padding: 34px 0; border-top: 1px solid rgba(255,255,255,.08); color: #9c898d; text-align: center; font-size: .85rem; }
    footer strong { display: block; color: #e9d9db; font-size: 1rem; margin-bottom: 4px; }
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.visible { opacity: 1; transform: none; }
    @media (max-width: 850px) { .nav-links { gap: 0; } .nav-links a { padding: 7px 6px; font-size: .77rem; } .grid { grid-template-columns: repeat(2,1fr); } .collab { grid-template-columns: 1fr; } }
    @media (max-width: 620px) {
      .container { width: min(100% - 26px, var(--max)); } nav { min-height: 64px; }
      .menu-toggle { display: block; } .nav-links { display: none; position: absolute; top: 64px; right: 13px; left: 13px; padding: 10px; flex-direction: column; align-items: stretch; background: rgba(15,7,9,.97); border: 1px solid var(--line); border-radius: 7px; box-shadow: 0 15px 35px rgba(0,0,0,.45); } .nav-links.open { display: flex; } .nav-links a { display: block; padding: 10px 13px; font-size: .9rem; }
      section { padding: 70px 0; } .hero { min-height: calc(100vh - 64px); padding-top: 44px; } h1 { font-size: clamp(2.6rem, 15vw, 4.5rem); } .subtitle { font-size: .84rem; } .lead { font-size: .95rem; } .quick-actions .btn { flex: 1 1 calc(50% - 6px); padding-inline: 8px; font-size: .78rem; }
      .grid, .game-list, .support-grid, .social-grid { grid-template-columns: 1fr; } .card { min-height: auto; } .download-box { align-items: stretch; flex-direction: column; padding: 22px; } .download-box .btn { width: 100%; }
    }
  </style>
</head>

</body>
</html>
